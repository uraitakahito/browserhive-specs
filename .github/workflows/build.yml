name: CI

# 公開は GitHub Pages が main を直接配る。この workflow は公開経路に居ないので、
# ここが転んでも公開は止まらない。する仕事は検査だけ。
#
# ReSpec は閲覧者のブラウザで走る。以前この方式を避けていたのは、失敗が失敗として
# 現れないため —— script が 404 でもページは 200 で返り、崩れた見た目を人が見に
# 行くまで誰も気づかない (uraitakahito/specs で実際に起きた)。
#
# 当時と違うのは、ReSpec を w3.org から読まず repo に同梱していること。同一
# オリジンのファイルが 404 になるのは「無い」か「パスが違う」ときだけで、それは
# assets job がブラウザ無しで見ている。
#
# 公開が CI を通らなくなった以上、壊れた原稿の merge を止められるのは下の検査
# だけになった。だから build は blocking のままにしてある。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # 書き込み権限は要らない。公開は Pages が main を直接配るので、この job は
    # どこへも push しない。
    strategy:
      matrix:
        doc:
          # 版を足したらここにも足す。焼かれない版は、壊れていても気づけない。
          - wacz-profile/1.23.0
          - wacz-profile/1.23.0/ja
          - wacz-profile/1.22.0
          - wacz-profile/1.22.0/ja
          - wacz-profile/1.21.0
          - wacz-profile/1.21.0/ja
          - wacz-profile/1.20.0
          - wacz-profile/1.20.0/ja
          - wacz-profile/1.19.0
          - wacz-profile/1.19.0/ja
          - wacz-profile/1.18.0
          - wacz-profile/1.18.0/ja
          - wacz-profile/1.17.0
          - wacz-profile/1.17.0/ja
          - wacz-profile/1.16.0
          - wacz-profile/1.16.0/ja
          - wacz-profile/1.15.0
          - wacz-profile/1.15.0/ja
          - wacz-profile/1.14.0
          - wacz-profile/1.14.0/ja
          - wacz-profile/1.13.0
          - wacz-profile/1.13.0/ja
          - wacz-profile/1.12.0
          - wacz-profile/1.12.0/ja
          - wacz-profile/1.11.0
          - wacz-profile/1.11.0/ja
          - wacz-profile/1.10.0
          - wacz-profile/1.10.0/ja
          - wacz-profile/1.9.0
          - wacz-profile/1.9.0/ja
          - wacz-profile/1.8.0
          - wacz-profile/1.8.0/ja
          - wacz-profile/1.7.0
          - wacz-profile/1.7.0/ja
          - wacz-profile/1.6.0
          - wacz-profile/1.6.0/ja
          - wacz-profile/1.5.0
          - wacz-profile/1.5.0/ja
          - wacz-profile/1.4.0
          - wacz-profile/1.4.0/ja
          - wacz-profile/1.3.0
          - wacz-profile/1.3.0/ja
          - wacz-profile/1.2.0
          - wacz-profile/1.2.0/ja
          - wacz-profile/1.1.0
          - wacz-profile/1.1.0/ja
          - wacz-profile/1.0.0
          - wacz-profile/1.0.0/ja
    steps:
      - uses: actions/checkout@v4

      # 2 回試す。ReSpec のビルドは 20 秒の総予算で走っており、その予算を
      # ブラウザの起動が食い尽くすと navigation に数百 ms しか残らずに落ちる
      # (実測: 起動 19.648 秒 → 残り 352 ms)。runner の混み具合で決まるので、
      # 原稿が正しくても落ちる。
      #
      # 予算は spec-prod が `-t 20` とハードコードしていて、入力からは触れない。
      # 後ろに `-t 60` を足す道も塞がっている: sade は同じ flag の繰り返しを
      # 配列にまとめるので `[20,60] * 1000` が NaN になり、長い形は無視される。
      #
      # 2 回で見分けがつく。flake は 2 回目でたいてい通り、壊れた原稿は何回でも
      # 同じ場所で落ちる。だから赤は本物のエラーだけになる。
      - uses: w3c/spec-prod@v2
        id: try1
        continue-on-error: true
        with:
          TOOLCHAIN: respec
          SOURCE: ${{ matrix.doc }}/index.html
          DESTINATION: ${{ matrix.doc }}/index.html
          VALIDATE_MARKUP: true
          VALIDATE_LINKS: false
          ARTIFACT_NAME: built-${{ strategy.job-index }}

      # continue-on-error を付けるのは 1 回目だけ。job 全体は blocking のまま
      # にする —— 公開が Pages 直配になった今、壊れた原稿の merge を止められる
      # のはこの検査だけなので、ここは赤くならねばならない。
      - uses: w3c/spec-prod@v2
        if: steps.try1.outcome == 'failure'
        with:
          TOOLCHAIN: respec
          SOURCE: ${{ matrix.doc }}/index.html
          DESTINATION: ${{ matrix.doc }}/index.html
          # markup 検査 (W3C nu validator) は既定で true。依存しているので明記する。
          VALIDATE_MARKUP: true
          # spec-prod のリンク検査は使えない。link-checker 1.4.2 が superagent
          # 3.8.3 に依存していて、リダイレクトを踏むと
          #   TypeError: Cannot convert undefined or null to object
          #     at cleanHeader (superagent/lib/utils.js:61)
          #     at Request._redirect (superagent/lib/node/index.js:427)
          # で落ちる。リンク切れの報告ではなくツール自体のクラッシュなので、
          # 何が悪いのか分からないまま赤くなる。しかも ReSpec は github: 設定から
          # .../issues/new/choose を自動生成し、これが未ログインだと 302 で
          # ログイン画面へ飛ぶ ── 何もしなくても必ず踏む。
          # 代わりに下の linkcheck job がリダイレクトを追って最終状態を見る。
          VALIDATE_LINKS: false
          ARTIFACT_NAME: built-${{ strategy.job-index }}

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 各原稿から同梱 ReSpec が解決すること
        run: |
          # 閲覧者のブラウザで描画する以上、script が引けなければページは崩れる。
          # 崩れても HTTP は 200 なので、公開後に気づく手立てが無い —— specs で
          # 実際に起きたのがこれ。
          #
          # ただし同一オリジンに置いてあるので、壊れ方は 2 つしかない: ファイルが
          # 無いか、パスが違うか。どちらもブラウザを起動せずに確かめられる。
          FAIL=0
          for doc in wacz-profile/1.23.0/index.html wacz-profile/1.23.0/ja/index.html \
                     wacz-profile/1.22.0/index.html wacz-profile/1.22.0/ja/index.html \
                     wacz-profile/1.21.0/index.html wacz-profile/1.21.0/ja/index.html \
                     wacz-profile/1.20.0/index.html wacz-profile/1.20.0/ja/index.html \
                     wacz-profile/1.19.0/index.html wacz-profile/1.19.0/ja/index.html \
                     wacz-profile/1.18.0/index.html wacz-profile/1.18.0/ja/index.html \
                     wacz-profile/1.17.0/index.html wacz-profile/1.17.0/ja/index.html \
                     wacz-profile/1.16.0/index.html wacz-profile/1.16.0/ja/index.html \
                     wacz-profile/1.15.0/index.html wacz-profile/1.15.0/ja/index.html \
                     wacz-profile/1.14.0/index.html wacz-profile/1.14.0/ja/index.html \
                     wacz-profile/1.13.0/index.html wacz-profile/1.13.0/ja/index.html \
                     wacz-profile/1.12.0/index.html wacz-profile/1.12.0/ja/index.html \
                     wacz-profile/1.11.0/index.html wacz-profile/1.11.0/ja/index.html \
                     wacz-profile/1.10.0/index.html wacz-profile/1.10.0/ja/index.html \
                     wacz-profile/1.9.0/index.html wacz-profile/1.9.0/ja/index.html \
                     wacz-profile/1.8.0/index.html wacz-profile/1.8.0/ja/index.html \
                     wacz-profile/1.7.0/index.html wacz-profile/1.7.0/ja/index.html \
                     wacz-profile/1.6.0/index.html wacz-profile/1.6.0/ja/index.html \
                     wacz-profile/1.5.0/index.html wacz-profile/1.5.0/ja/index.html \
                     wacz-profile/1.4.0/index.html wacz-profile/1.4.0/ja/index.html \
                     wacz-profile/1.3.0/index.html wacz-profile/1.3.0/ja/index.html \
                     wacz-profile/1.2.0/index.html wacz-profile/1.2.0/ja/index.html \
                     wacz-profile/1.1.0/index.html wacz-profile/1.1.0/ja/index.html \
                     wacz-profile/1.0.0/index.html wacz-profile/1.0.0/ja/index.html; do
            src=$(grep -o 'src="[^"]*respec[^"]*"' "$doc" | sed 's/src="//; s/"$//')
            if [ -z "$src" ]; then
              echo "::error::$doc が ReSpec を読み込んでいない"
              FAIL=1
              continue
            fi
            target="$(dirname "$doc")/$src"
            if [ -f "$target" ]; then
              echo "  ok   $doc -> $src"
            else
              echo "::error::$doc -> $src が解決しない"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: 最新の版の節が錨を原稿に持つこと
        run: |
          # browserhive の要求の目録は、この profile の節を錨で指し、その錨が在るかを
          # ブラウザを起こさずに原稿から読む。
          #
          # ReSpec は id の無い section にも、描くときに見出しから id を作る。読者の
          # リンクはそれで動くが、原稿には現れないので、静的に読む側からは見えない。
          # section で包まずに置いた見出し（1.14.0 の tls.hosts と tls.chains がそうだった）
          # も、ReSpec が描くときに包んで id を付ける。これも原稿には無い。
          #
          # 見るのは latest/ だけ。新しい版を出すときは latest/ をその版で上書きするので、
          # ここがいつも最新の版になる。
          #
          # Conformance の節だけは id を書かない。ReSpec は section#conformance を特別に
          # 扱い、書くと RFC 2119 の定型文が入り、参考文献が Informative から Normative に
          # 変わる（1.14.0 で試した）。描画を変えずには書けない。
          FAIL=0
          for doc in wacz-profile/latest/index.html wacz-profile/latest/ja/index.html; do
            perl -0777 -ne '
              my $bad = 0;
              while (/<section\b(?![^>]*\bid=)[^>]*>\s*(?:<h([2-6])\b[^>]*>(.*?)<\/h\1>)?/gs) {
                my $t = defined $2 ? $2 : "(見出しが無い)";
                $t =~ s/<[^>]+>//g;
                next if $t eq "Conformance";
                print "::error file=${ARGV}::id の無い section: $t\n";
                $bad = 1;
              }
              while (/<h([2-6])\b[^>]*>(.*?)<\/h\1>/gs) {
                my $start = $-[0];
                my $t = $2;
                $t =~ s/<[^>]+>//g;
                next if substr($_, 0, $start) =~ /<section\b[^>]*>\s*\z/;
                print "::error file=${ARGV}::section の最初の子でない見出し: $t\n";
                $bad = 1;
              }
              exit $bad;
            ' "$doc" && echo "  ok   $doc" || FAIL=1
          done
          exit $FAIL

      - name: WARC の例の Content-Length が本文のバイト数と合うこと
        env:
          DOCS: wacz-profile/*/index.html wacz-profile/*/ja/index.html
        run: |
          # 例のレコードの Content-Length は人が手で数えて書いた値で、版を写すたびに一緒に写る。
          # 1.2.0 の 118（実際は 115）と 1.3.0〜1.15.0 の 112（実際は 87）が、13 版のあいだ誰にも
          # 気づかれずに残っていた（2026-11-01 に訂正）。application/warc-fields の行の終わりは
          # CRLF なので、本文を CRLF で数え直して照らす。
          python3 - <<'PY'
          import glob, html, os, re, sys
          docs = sorted({p for g in os.environ["DOCS"].split() for p in glob.glob(g)})
          seen = bad = 0
          for p in docs:
              text = open(p, encoding="utf-8").read()
              for pre in re.findall(r"<pre\b[^>]*>(.*?)</pre>", text, flags=re.S):
                  s = html.unescape(pre).lstrip("\n")
                  if not s.startswith("WARC/1.1"):
                      continue
                  head, sep, body = s.partition("\n\n")
                  m = re.search(r"^Content-Length: (\d+)$", head, flags=re.M)
                  if not sep or m is None:
                      print(f"::error file={p}::WARC の例に Content-Length か、ヘッダの後の空行が無い")
                      bad += 1
                      continue
                  seen += 1
                  lines = body.strip("\n").split("\n")
                  actual = 0 if lines == [""] else len(("\r\n".join(lines) + "\r\n").encode("utf-8"))
                  if actual != int(m.group(1)):
                      print(f"::error file={p}::Content-Length {m.group(1)} だが、本文は {actual} バイト（1 行目: {lines[0]}）")
                      bad += 1
          print(f"WARC の例: {seen} 個（{len(docs)} 文書）")
          if seen == 0:
              print("::error::WARC の例を 1 つも見つけられない。何も見ていない緑にしない")
              bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: ja の冒頭の版が置き場の版と合うこと
        env:
          JA_DOCS: wacz-profile/*/ja/index.html
          TITLE: BrowserHive WACZ Profile
        run: |
          # 1.9.0 の訳を写して 1.10.0 を作ったとき冒頭の版を直し忘れ、1.14.0 まで写り続けた
          # （2026-11-01 に訂正）。latest/ja/ は latest/index.html の title の版と比べる。
          python3 - <<'PY'
          import glob, os, re, sys
          title = os.environ["TITLE"]
          checked = bad = 0
          for p in sorted(glob.glob(os.environ["JA_DOCS"])):
              version_dir = os.path.dirname(os.path.dirname(p))
              version = os.path.basename(version_dir)
              if version == "latest":
                  en = open(os.path.join(version_dir, "index.html"), encoding="utf-8").read()
                  t = re.search(r"<title>" + re.escape(title) + r" ([0-9.]+)</title>", en)
                  want = t.group(1) if t else None
              else:
                  want = version
              m = re.search(r"これは " + re.escape(title) + r" ([0-9.]+) の日本語訳です", open(p, encoding="utf-8").read())
              checked += 1
              if m is None or want is None:
                  print(f"::error file={p}::冒頭の「これは {title} N の日本語訳です」か、比べる版が見つからない")
                  bad += 1
              elif m.group(1) != want:
                  print(f"::error file={p}::冒頭は {m.group(1)} の日本語訳と書くが、置き場の版は {want}")
                  bad += 1
          print(f"ja の冒頭: {checked} 本")
          if checked == 0:
              print("::error::ja の原稿を 1 本も見つけられない。何も見ていない緑にしない")
              bad += 1
          sys.exit(1 if bad else 0)
          PY

  linkcheck:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          # merge しない。どちらの artifact も index.html という名前なので、
          # 混ぜると片方が上書きされて検査されないまま緑になる。
          pattern: built-*
          path: built
      - name: Every link in the built document resolves
        run: |
          # 外部リンクの検査は一過性の失敗と本物の切れを見分けないと使いものに
          # ならない。実際に初回で 429 (GitHub のレート制限) と 503 (w3.org の
          # 一時障害) を踏んだ。どちらも数十秒後には 200 を返した。
          #
          # 判定:
          #   200            通す
          #   429 / 5xx / 0  間を置いて再試行。最後まで駄目なら落とす
          #   その他 4xx     即座に落とす (本物の切れ)
          check() {
            local url=$1 code
            for attempt in 1 2 3; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' \
                     -A 'Mozilla/5.0 (compatible; browserhive-specs linkcheck)' \
                     --max-time 30 "$url" || echo 000)
              case "$code" in
                200) echo "  200 $url"; return 0 ;;
                429|5??|000) sleep $((attempt * 10)) ;;
                *) echo "::error::$url -> $code"; return 1 ;;
              esac
            done
            echo "::error::$url -> $code (3 回試して駄目)"
            return 1
          }

          # 検査するのは「著者が書いたリンク」だけにする。
          #
          # ReSpec は github: の設定から、リポジトリ・commits・issues・pulls への
          # リンクを自動生成する。これらは構成から機械的に導かれるので、検査して
          # 情報が増えない。むしろ実害があって、GitHub は runner からの未認証
          # アクセスを強くレート制限し、commits/ は 3 回再試行しても 429 のまま
          # だった。公開先の github.io も、初回 deploy までは必ず 404 になる。
          #
          # 落としたいのは本文中の引用が死んでいる場合なので、そこだけ見る。
          OWNER=${GITHUB_REPOSITORY%%/*}
          SKIP="^https://(github\.com/${GITHUB_REPOSITORY}|${OWNER}\.github\.io/${GITHUB_REPOSITORY#*/})"

          FAIL=0
          # 落としたすべての文書を対象にする。ファイルを 1 本も見つけられないまま
          # 緑になることがないよう、件数を確かめてから回る。
          DOCS=$(find built -name '*.html' | sort)
          test -n "$DOCS" || { echo "::error::検査対象の HTML が無い"; exit 1; }
          echo "対象: $(echo "$DOCS" | wc -l) 文書"
          REFS=$(grep -hoE '(href|src)="https?://[^"]*"' $DOCS \
                 | sed -E 's/^(href|src)="//; s/"$//' | sort -u)
          for U in $REFS; do
            if echo "$U" | grep -qE "$SKIP"; then
              echo "  skip $U (toolchain が生成した定型リンク)"
              continue
            fi
            check "$U" || FAIL=1
          done
          exit $FAIL
