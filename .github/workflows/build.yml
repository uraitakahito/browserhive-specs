name: CI

# 公開は GitHub Pages が main を直接配る。この workflow は公開経路に居ないので、
# ここが転んでも公開は止まらない。する仕事は検査だけ。
#
# ReSpec は閲覧者のブラウザで走る。以前この方式を避けていたのは、失敗が失敗として
# 現れないため —— script が 404 でもページは 200 で返り、崩れた見た目を人が見に
# 行くまで誰も気づかない (uraitakahito/specs で実際に起きた)。
#
# 当時と違うのは、ReSpec を w3.org から読まず repo に同梱していること。同一
# オリジンのファイルが 404 になるのは「無い」か「パスが違う」ときだけで、それは
# assets job がブラウザ無しで見ている。
#
# 公開が CI を通らなくなった以上、壊れた原稿の merge を止められるのは下の検査
# だけになった。だから build は blocking のままにしてある。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # 書き込み権限は要らない。公開は Pages が main を直接配るので、この job は
    # どこへも push しない。
    strategy:
      matrix:
        doc:
          - wacz-profile/1.0.0
          - wacz-profile/1.0.0/ja
    steps:
      - uses: actions/checkout@v4

      # 2 回試す。ReSpec のビルドは 20 秒の総予算で走っており、その予算を
      # ブラウザの起動が食い尽くすと navigation に数百 ms しか残らずに落ちる
      # (実測: 起動 19.648 秒 → 残り 352 ms)。runner の混み具合で決まるので、
      # 原稿が正しくても落ちる。
      #
      # 予算は spec-prod が `-t 20` とハードコードしていて、入力からは触れない。
      # 後ろに `-t 60` を足す道も塞がっている: sade は同じ flag の繰り返しを
      # 配列にまとめるので `[20,60] * 1000` が NaN になり、長い形は無視される。
      #
      # 2 回で見分けがつく。flake は 2 回目でたいてい通り、壊れた原稿は何回でも
      # 同じ場所で落ちる。だから赤は本物のエラーだけになる。
      - uses: w3c/spec-prod@v2
        id: try1
        continue-on-error: true
        with:
          TOOLCHAIN: respec
          SOURCE: ${{ matrix.doc }}/index.html
          DESTINATION: ${{ matrix.doc }}/index.html
          VALIDATE_MARKUP: true
          VALIDATE_LINKS: false
          ARTIFACT_NAME: built-${{ strategy.job-index }}

      # continue-on-error を付けるのは 1 回目だけ。job 全体は blocking のまま
      # にする —— 公開が Pages 直配になった今、壊れた原稿の merge を止められる
      # のはこの検査だけなので、ここは赤くならねばならない。
      - uses: w3c/spec-prod@v2
        if: steps.try1.outcome == 'failure'
        with:
          TOOLCHAIN: respec
          SOURCE: ${{ matrix.doc }}/index.html
          DESTINATION: ${{ matrix.doc }}/index.html
          # markup 検査 (W3C nu validator) は既定で true。依存しているので明記する。
          VALIDATE_MARKUP: true
          # spec-prod のリンク検査は使えない。link-checker 1.4.2 が superagent
          # 3.8.3 に依存していて、リダイレクトを踏むと
          #   TypeError: Cannot convert undefined or null to object
          #     at cleanHeader (superagent/lib/utils.js:61)
          #     at Request._redirect (superagent/lib/node/index.js:427)
          # で落ちる。リンク切れの報告ではなくツール自体のクラッシュなので、
          # 何が悪いのか分からないまま赤くなる。しかも ReSpec は github: 設定から
          # .../issues/new/choose を自動生成し、これが未ログインだと 302 で
          # ログイン画面へ飛ぶ ── 何もしなくても必ず踏む。
          # 代わりに下の linkcheck job がリダイレクトを追って最終状態を見る。
          VALIDATE_LINKS: false
          ARTIFACT_NAME: built-${{ strategy.job-index }}

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 各原稿から同梱 ReSpec が解決すること
        run: |
          # 閲覧者のブラウザで描画する以上、script が引けなければページは崩れる。
          # 崩れても HTTP は 200 なので、公開後に気づく手立てが無い —— specs で
          # 実際に起きたのがこれ。
          #
          # ただし同一オリジンに置いてあるので、壊れ方は 2 つしかない: ファイルが
          # 無いか、パスが違うか。どちらもブラウザを起動せずに確かめられる。
          FAIL=0
          for doc in wacz-profile/1.0.0/index.html wacz-profile/1.0.0/ja/index.html; do
            src=$(grep -o 'src="[^"]*respec[^"]*"' "$doc" | sed 's/src="//; s/"$//')
            if [ -z "$src" ]; then
              echo "::error::$doc が ReSpec を読み込んでいない"
              FAIL=1
              continue
            fi
            target="$(dirname "$doc")/$src"
            if [ -f "$target" ]; then
              echo "  ok   $doc -> $src"
            else
              echo "::error::$doc -> $src が解決しない"
              FAIL=1
            fi
          done
          exit $FAIL

  linkcheck:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          # merge しない。どちらの artifact も index.html という名前なので、
          # 混ぜると片方が上書きされて検査されないまま緑になる。
          pattern: built-*
          path: built
      - name: Every link in the built document resolves
        run: |
          # 外部リンクの検査は一過性の失敗と本物の切れを見分けないと使いものに
          # ならない。実際に初回で 429 (GitHub のレート制限) と 503 (w3.org の
          # 一時障害) を踏んだ。どちらも数十秒後には 200 を返した。
          #
          # 判定:
          #   200            通す
          #   429 / 5xx / 0  間を置いて再試行。最後まで駄目なら落とす
          #   その他 4xx     即座に落とす (本物の切れ)
          check() {
            local url=$1 code
            for attempt in 1 2 3; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' \
                     -A 'Mozilla/5.0 (compatible; browserhive-specs linkcheck)' \
                     --max-time 30 "$url" || echo 000)
              case "$code" in
                200) echo "  200 $url"; return 0 ;;
                429|5??|000) sleep $((attempt * 10)) ;;
                *) echo "::error::$url -> $code"; return 1 ;;
              esac
            done
            echo "::error::$url -> $code (3 回試して駄目)"
            return 1
          }

          # 検査するのは「著者が書いたリンク」だけにする。
          #
          # ReSpec は github: の設定から、リポジトリ・commits・issues・pulls への
          # リンクを自動生成する。これらは構成から機械的に導かれるので、検査して
          # 情報が増えない。むしろ実害があって、GitHub は runner からの未認証
          # アクセスを強くレート制限し、commits/ は 3 回再試行しても 429 のまま
          # だった。公開先の github.io も、初回 deploy までは必ず 404 になる。
          #
          # 落としたいのは本文中の引用が死んでいる場合なので、そこだけ見る。
          OWNER=${GITHUB_REPOSITORY%%/*}
          SKIP="^https://(github\.com/${GITHUB_REPOSITORY}|${OWNER}\.github\.io/${GITHUB_REPOSITORY#*/})"

          FAIL=0
          # 落としたすべての文書を対象にする。ファイルを 1 本も見つけられないまま
          # 緑になることがないよう、件数を確かめてから回る。
          DOCS=$(find built -name '*.html' | sort)
          test -n "$DOCS" || { echo "::error::検査対象の HTML が無い"; exit 1; }
          echo "対象: $(echo "$DOCS" | wc -l) 文書"
          REFS=$(grep -hoE '(href|src)="https?://[^"]*"' $DOCS \
                 | sed -E 's/^(href|src)="//; s/"$//' | sort -u)
          for U in $REFS; do
            if echo "$U" | grep -qE "$SKIP"; then
              echo "  skip $U (toolchain が生成した定型リンク)"
              continue
            fi
            check "$U" || FAIL=1
          done
          exit $FAIL
